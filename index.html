<div id="startModal" class="start-modal">
    <div class="start-box">
        <h2>📢 시작 전 안내</h2>

        <ul>
            <li>모든 칸을 채운 후 제출하세요.</li>
            <li>각 행, 열에는 1~9가 한 번씩만 들어갑니다.</li>
            <li>같은 색 영역의 숫자 합은 왼쪽 위 숫자와 같아야 합니다.</li>
            <li>제출 후에는 수정할 수 없습니다.</li>
            <li>'지우기'버튼은 파란색으로 표시된 곳만 지워집니다.</li>
        </ul>

        <button onclick="startGame()">시작하기</button>
    </div>
</div>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>백현중 R&E 7-8월 행사 - 스도쿠</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
        h1 { color: #333; margin-bottom: 5px; }
        .step { color: #6c757d; font-size: 15px; margin-bottom: 15px; }
        .user-info { display: flex; gap: 10px; margin-bottom: 15px; }
        .user-info input { padding: 10px; font-size: 16px; border: 2px solid #ccc; border-radius: 5px; width: 140px; text-align: center; }
        .user-info input:focus { outline: none; border-color: #007bff; }
        .controls { display: flex; gap: 10px; margin-bottom: 15px; }
        .controls button { padding: 10px 20px; font-size: 16px; border: none; background-color: #6c757d; color: white; border-radius: 5px; cursor: pointer; }
        .controls button.submit { background-color: #28a745; }
        .sudoku-board { display: grid; grid-template-columns: repeat(9, 42px); grid-template-rows: repeat(9, 42px); border: 4px solid #000; margin-bottom: 20px; background-color: #ccc; gap: 1px; }
        .cell { width: 42px; height: 42px; background-color: white; display: flex; justify-content: center; align-items: center; font-size: 22px; font-weight: bold; cursor: pointer; user-select: none; box-sizing: border-box; }
        .cell:nth-child(3n) { border-right: 3px solid #000; }
        .cell:nth-child(9n) { border-right: none; }
        .sudoku-board > .cell:nth-child(n+19):nth-child(-n+27), .sudoku-board > .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 3px solid #000; }
        .cell.given { color: #222; background-color: #e9ecef; cursor: default; }
        .cell.selected { background-color: #b3d4ff; border: 2px solid #007bff; z-index: 10; }
        .numpad { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; margin-bottom: 20px; }
        .numpad button { width: 70px; height: 50px; font-size: 20px; border: none; background-color: #007bff; color: white; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🧩 R&E 7월 행사 - 스도쿠</h1>
    <div class="step">1단계 / 2단계 · 제출하면 킬러 스도쿠로 넘어갑니다</div>

<div class="user-info">
    <input type="text" id="student-id" placeholder="학번 (예: 10101)">
    <input type="text" id="student-name" placeholder="이름 (예: 홍길동)">
</div>

<div class="sudoku-board" id="board"></div>

<div class="numpad">
    <button onclick="inputNumber(1)">1</button>
    <button onclick="inputNumber(2)">2</button>
    <button onclick="inputNumber(3)">3</button>
    <button onclick="inputNumber(4)">4</button>
    <button onclick="inputNumber(5)">5</button>
    <button onclick="inputNumber(6)">6</button>
    <button onclick="inputNumber(7)">7</button>
    <button onclick="inputNumber(8)">8</button>
    <button onclick="inputNumber(9)">9</button>
</div>

<div class="controls">
    <button onclick="clearCell()">지우기</button>
    <button class="submit" onclick="submitSudoku()">다음 단계로</button>
</div>

<script>
    /* ===== 설정 ===== */
    // 킬러 스도쿠 파일 이름 (GitHub에 올린 실제 파일명과 같아야 합니다)
    const NEXT_PAGE = "killer.html";
    const STORAGE_KEY = "sudokuStage1";

    const initialBoard = [
        2, 0, 5, 0, 0, 7, 0, 0, 6,
        4, 0, 0, 9, 6, 0, 0, 2, 0,
        0, 0, 0, 0, 8, 0, 0, 4, 5,
        9, 8, 0, 0, 7, 4, 0, 0, 0,
        5, 7, 0, 8, 0, 2, 0, 6, 9,
        0, 0, 0, 6, 3, 0, 0, 5, 7,
        7, 5, 0, 0, 2, 0, 0, 0, 0,
        0, 6, 0, 0, 5, 1, 0, 0, 2,
        3, 0, 0, 4, 0, 0, 5, 0, 8
    ];

    let selectedCellIndex = null;

    function initBoard() {
        const boardEl = document.getElementById('board');
        for (let i = 0; i < 81; i++) {
            const cell = document.createElement('div');
            cell.classList.add('cell');
            if (initialBoard[i] !== 0) {
                cell.innerText = initialBoard[i];
                cell.classList.add('given');
            } else {
                cell.addEventListener('click', () => selectCell(i, cell));
            }
            cell.id = 'cell-' + i;
            boardEl.appendChild(cell);
        }
        restoreProgress();
    }

    // 킬러 스도쿠에서 '뒤로 가기'로 돌아온 경우 입력했던 내용을 되살립니다
    function restoreProgress() {
        const saved = sessionStorage.getItem(STORAGE_KEY);
        if (!saved) return;
        try {
            const data = JSON.parse(saved);
            document.getElementById('student-id').value = data.studentId || "";
            document.getElementById('student-name').value = data.studentName || "";
            if (data.answer && data.answer.length === 81) {
                for (let i = 0; i < 81; i++) {
                    if (initialBoard[i] === 0) {
                        document.getElementById('cell-' + i).innerText = data.answer[i];
                    }
                }
            }
        } catch (e) {
            sessionStorage.removeItem(STORAGE_KEY);
        }
    }

    function selectCell(index, cellEl) {
        if (selectedCellIndex !== null) document.getElementById('cell-' + selectedCellIndex).classList.remove('selected');
        selectedCellIndex = index;
        cellEl.classList.add('selected');
    }

    function inputNumber(num) {
        if (selectedCellIndex !== null) document.getElementById('cell-' + selectedCellIndex).innerText = num;
        else alert("먼저 숫자를 입력할 빈칸을 선택해 줘!");
    }

    function clearCell() {
        if (selectedCellIndex !== null) document.getElementById('cell-' + selectedCellIndex).innerText = "";
    }

    // PC 키보드 입력
    window.addEventListener('keydown', function(event) {
        if (document.activeElement.tagName === 'INPUT') return;
        if (selectedCellIndex !== null) {
            if (event.key >= '1' && event.key <= '9') {
                inputNumber(event.key);
            } else if (event.key === 'Backspace' || event.key === 'Delete') {
                clearCell();
            }
        }
    });

    function submitSudoku() {
        const studentId = document.getElementById('student-id').value.trim();
        const studentName = document.getElementById('student-name').value.trim();

        if (studentId === "" || studentName === "") {
            alert("❌ 학번과 이름을 입력하셔야 제출이 가능합니다.");
            return;
        }

        let studentAnswer = "";
        for (let i = 0; i < 81; i++) {
            const cellText = document.getElementById('cell-' + i).innerText.trim();
            if (cellText === "") {
                alert("⚠️ 스도쿠의 모든 빈칸을 채워야 다음 단계로 넘어갈 수 있습니다!");
                return;
            }
            studentAnswer += cellText;
        }

        // 구글폼 전송은 아직 하지 않고, 임시 저장만 합니다
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
            studentId: studentId,
            studentName: studentName,
            answer: studentAnswer
        }));

        alert(`✅ 1단계 저장 완료!\n${studentId} ${studentName} 학생, 이제 킬러 스도쿠에 도전하세요.`);
        window.location.href = NEXT_PAGE;
    }

    window.onload = initBoard;
</script>
</body>
</html>
